<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" fill="#05070d"/>

  <!-- Orbital ring symbol (simplified S/planet with rings) -->
  <g transform="translate(96, 96)">
    <!-- Outer glow -->
    <circle cx="0" cy="0" r="68" fill="none" stroke="#3ad6ff" stroke-width="2" opacity="0.3"/>

    <!-- Main orbital path (top right ring) -->
    <path d="M -20 -50 Q 40 -60 60 -20 Q 50 20 0 30" fill="none" stroke="#3ad6ff" stroke-width="6" stroke-linecap="round"/>

    <!-- Central S-curve -->
    <path d="M -35 -25 Q -10 0 0 15 Q 15 25 35 15" fill="none" stroke="#7c6bff" stroke-width="7" stroke-linecap="round"/>

    <!-- Bottom ring segment -->
    <path d="M -55 20 Q -20 50 35 45 Q 55 40 60 15" fill="none" stroke="#3ad6ff" stroke-width="5" stroke-linecap="round"/>

    <!-- Top accent dot -->
    <circle cx="0" cy="-50" r="3" fill="#3ad6ff"/>
  </g>
</svg>