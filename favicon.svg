<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3ad6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c6bff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" fill="#05070d"/>

  <!-- Simple orbital ring -->
  <circle cx="96" cy="96" r="65" fill="none" stroke="url(#grad)" stroke-width="8" opacity="0.9"/>

  <!-- S-curve in the middle -->
  <path d="M 60 96 Q 96 70 96 96 Q 96 122 132 96" fill="none" stroke="url(#grad)" stroke-width="6" stroke-linecap="round" opacity="0.95"/>

  <!-- Accent dot -->
  <circle cx="96" cy="45" r="4" fill="#3ad6ff"/>
</svg>