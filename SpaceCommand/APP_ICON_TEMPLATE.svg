<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3ad6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c6bff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with rounded corners (App Store requirement) -->
  <rect width="1024" height="1024" fill="url(#bgGradient)" rx="100"/>

  <!-- Main Text: SC -->
  <text x="512" y="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="520" font-weight="700" text-anchor="middle" fill="white" filter="url(#glow)">SC</text>

  <!-- Subtitle: Rocket icon or text -->
  <text x="512" y="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="80" font-weight="500" text-anchor="middle" fill="rgba(255,255,255,0.8)">SPACE COMMAND</text>
</svg>
