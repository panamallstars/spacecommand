<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3ad6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c6bff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- White background for iOS home screen -->
  <rect width="180" height="180" fill="#ffffff"/>

  <!-- Simple orbital ring -->
  <circle cx="90" cy="90" r="55" fill="none" stroke="url(#grad)" stroke-width="7" opacity="0.95"/>

  <!-- S-curve -->
  <path d="M 55 90 Q 90 65 90 90 Q 90 115 125 90" fill="none" stroke="url(#grad)" stroke-width="5" stroke-linecap="round" opacity="0.95"/>

  <!-- Accent dot -->
  <circle cx="90" cy="40" r="3" fill="#3ad6ff"/>
</svg>